<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where Memory Lives</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bizstream/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&amp;family=Poppins:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
.dash{animation:stream-in .6s cubic-bezier(0.34,1.56,0.64,1) both;animation-delay:calc(var(--d,0ms) * .5)}
@keyframes stream-in{from{opacity:0;transform:translateX(160px)}}
@media (prefers-reduced-motion: reduce){.dash{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; padding: 130px 150px; display: flex; flex-direction: column; gap: 28px; background: #1F3D7A; font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; color: #FFFFFF; overflow: hidden;">
  <div aria-hidden="true" style="position: absolute; top: 112px; right: -30px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px;">
    <div style="display: flex; gap: 10px;">
      <div class="dash" style="--d: 0ms; width: 60px; height: 14px; border-radius: 9999px; background: #163470;"></div>
      <div class="dash" style="--d: 25ms; width: 140px; height: 14px; border-radius: 9999px; background: #56C5E8;"></div>
      <div class="dash" style="--d: 50ms; width: 80px; height: 14px; border-radius: 9999px; background: #3F64C8;"></div>
      <div class="dash" style="--d: 75ms; width: 36px; height: 14px; border-radius: 9999px; background: #56C5E8;"></div>
      <div class="dash" style="--d: 100ms; width: 120px; height: 14px; border-radius: 9999px; background: #163470;"></div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div class="dash" style="--d: 125ms; width: 100px; height: 14px; border-radius: 9999px; background: #3F64C8;"></div>
      <div class="dash" style="--d: 150ms; width: 50px; height: 14px; border-radius: 9999px; background: #F2434A;"></div>
      <div class="dash" style="--d: 175ms; width: 150px; height: 14px; border-radius: 9999px; background: #56C5E8;"></div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div class="dash" style="--d: 200ms; width: 130px; height: 14px; border-radius: 9999px; background: #56C5E8;"></div>
      <div class="dash" style="--d: 225ms; width: 40px; height: 14px; border-radius: 9999px; background: #163470;"></div>
      <div class="dash" style="--d: 250ms; width: 90px; height: 14px; border-radius: 9999px; background: #3F64C8;"></div>
      <div class="dash" style="--d: 275ms; width: 60px; height: 14px; border-radius: 9999px; background: #56C5E8;"></div>
      <div class="dash" style="--d: 300ms; width: 70px; height: 14px; border-radius: 9999px; background: #3F64C8;"></div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div class="dash" style="--d: 325ms; width: 80px; height: 14px; border-radius: 9999px; background: #3F64C8;"></div>
      <div class="dash" style="--d: 350ms; width: 110px; height: 14px; border-radius: 9999px; background: #163470;"></div>
      <div class="dash" style="--d: 375ms; width: 40px; height: 14px; border-radius: 9999px; background: #56C5E8;"></div>
      <div class="dash" style="--d: 400ms; width: 90px; height: 14px; border-radius: 9999px; background: #56C5E8;"></div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div class="dash" style="--d: 425ms; width: 150px; height: 14px; border-radius: 9999px; background: #56C5E8;"></div>
      <div class="dash" style="--d: 450ms; width: 36px; height: 14px; border-radius: 9999px; background: #F2434A;"></div>
      <div class="dash" style="--d: 475ms; width: 100px; height: 14px; border-radius: 9999px; background: #3F64C8;"></div>
      <div class="dash" style="--d: 500ms; width: 70px; height: 14px; border-radius: 9999px; background: #163470;"></div>
    </div>
  </div>
  <p style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #56C5E8;">Memory</p>
  <h2 style="margin: 0; font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; font-size: 96px; line-height: 1.05; font-weight: 800; letter-spacing: -0.01em;">Where Memory Lives</h2>
  <p style="margin: 0; font-size: 38px; font-weight: 500; color: #DCE8F5; max-width: 1300px;">Most languages use a stack and a heap. Goose only uses stacks.</p>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; margin-top: 72px;">
    <div style="box-sizing: border-box; padding: 44px 52px; border-radius: 12px; background: #2A4C8F; display: flex; flex-direction: column; gap: 36px;">
      <h3 style="margin: 0; font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; font-size: 44px; font-weight: 700;">Most languages</h3>
      <div style="display: flex; gap: 24px;">
        <div style="flex: 1 1 0; height: 120px; border-radius: 12px; background: #152B57; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 600;">Stack</div>
        <div style="flex: 1 1 0; height: 120px; border-radius: 12px; background: #152B57; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 600;">Heap</div>
      </div>
      <p style="margin: 0; font-size: 28px; color: #DCE8F5;">The heap needs a garbage collector, or you free it by hand.</p>
    </div>
    <div style="box-sizing: border-box; padding: 44px 52px; border-radius: 12px; background: #2A4C8F; display: flex; flex-direction: column; gap: 36px;">
      <h3 style="margin: 0; font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; font-size: 44px; font-weight: 700; color: #56C5E8;">Goose</h3>
      <div style="display: flex; gap: 24px;">
        <div style="flex: 1 1 0; height: 120px; border-radius: 12px; background: #56C5E8; color: #10264F; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 600;">Stacks</div>
        <div style="flex: 1 1 0; height: 120px; box-sizing: border-box; border-radius: 12px; border: 3px dashed #F2434A; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 600; color: #FFB0B1;">No heap</div>
      </div>
      <p style="margin: 0; font-size: 28px; color: #DCE8F5;">Memory is handed out in order and given back when a block ends.</p>
    </div>
  </div>
</div>
</x-dc>
